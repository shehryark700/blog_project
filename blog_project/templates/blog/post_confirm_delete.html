{% extends "base.html" %}

{% block title %}Delete Post - Django Blog{% endblock %}

{% block content %}
    <h1>Delete Post</h1>
    <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{{ post.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
